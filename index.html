<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>THE SYSTEM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --neon-cyan: #00f2ff;
            --bg-dark: rgba(2, 12, 18, 0.95);
        }

        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #001a24 0%, #000 100%);
        }

        .system-wrapper {
            position: relative;
            width: 85%;
            max-width: 380px;
            perspective: 1000px;
        }

        .neon-bar {
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), #fff, var(--neon-cyan), transparent);
            box-shadow: 0 0 10px var(--neon-cyan);
            margin: 4px 0;
            animation: barPulse 2s infinite ease-in-out;
        }

        .system-window {
            background: var(--bg-dark);
            border: 1px solid rgba(0, 242, 255, 0.15);
            padding: 25px 20px;
            position: relative;
            backdrop-filter: blur(10px);
            clip-path: polygon(8% 0, 92% 0, 100% 12%, 100% 88%, 92% 100%, 8% 100%, 0 88%, 0 12%);
            animation: windowIn 0.6s ease-out;
            display: none; /* إخفاء النوافذ افتراضياً */
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 242, 255, 0.1);
            padding-bottom: 10px;
        }

        .alert-icon {
            width: 25px;
            height: 25px;
            border: 1.5px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-cyan);
            font-weight: 900;
            font-size: 14px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .system-title {
            color: #fff;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .content {
            color: #d1f7ff;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 25px;
        }

        .accept-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 30px;
            font-family: 'Cairo';
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: block;
            margin: 10px auto 0;
            width: 80%;
        }

        .accept-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .accept-btn:disabled {
            border-color: #444;
            color: #444;
            cursor: not-allowed;
        }

        /* تنسيقات شاشة الحالة والمهمات بنفس روح تصميمك */
        .stat-row { display: flex; justify-content: space-between; margin: 12px 0; color: #d1f7ff; font-size: 15px; }
        .stat-value { color: var(--neon-cyan); font-weight: bold; }
        .progress-container { width: 100%; height: 6px; background: #1a1a1a; border-radius: 3px; margin: 10px 0; border: 1px solid rgba(0, 242, 255, 0.2); overflow: hidden;}
        .progress-bar { width: 0%; height: 100%; background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); transition: width 0.4s; }
        .rank-text { font-size: 28px; font-weight: 900; color: #ff4d4d; text-align: center; margin: 15px 0; text-shadow: 0 0 15px #ff4d4d; }

        .quest-item { background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.1); padding: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }

        .footer-note { font-size: 10px; color: rgba(255, 255, 255, 0.25); margin-top: 15px; text-align: center; }

        @keyframes windowIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes barPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="system-wrapper">
        <div class="neon-bar"></div>

        <div id="win-accept" class="system-window" style="display: block;">
            <div class="header-box">
                <div class="alert-icon">!</div>
                <div class="system-title">تنبيه النظام</div>
            </div>
            <div class="content">
                مرحباً بك، <span id="p-name1" style="color:#fff; font-weight:bold;">..</span>.<br>
                لقد استوفيت شروط الانضمام إلى <br>
                <span style="color:var(--neon-cyan); font-weight:bold;">"نظام الارتقاء الذاتي"</span>.
            </div>
            <button class="accept-btn" onclick="goTo('win-status')">قـبـول</button>
            <div class="footer-note">تحذير: القرار نهائي وغير قابل للرجوع.</div>
        </div>

        <div id="win-status" class="system-window">
            <div class="header-box">
                <div class="system-title">STATUS | الحالة</div>
            </div>
            <div class="stat-row"><span>اللاعب:</span> <span id="p-name2" class="stat-value">..</span></div>
            <div class="stat-row"><span>المستوى:</span> <span class="stat-value">1</span></div>
            <div class="stat-row"><span>الخبرة:</span> <span id="xp-text" class="stat-value">0 / 100</span></div>
            <div class="progress-container"><div id="xp-bar" class="progress-bar"></div></div>
            <div class="rank-text">RANK: E</div>
            <button class="accept-btn" onclick="goTo('win-quests')">قائمة المهمات</button>
        </div>

        <div id="win-quests" class="system-window">
            <div class="header-box">
                <div class="system-title">DAILY QUESTS</div>
            </div>
            <div class="quest-item">
                <div style="font-size:13px; color:#fff;">التمرين اليومي <br><small style="color:var(--neon-cyan)">+30 XP</small></div>
                <button id="q1" class="accept-btn" style="width:auto; margin:0;" onclick="addXP(30, 'q1')">إكمال</button>
            </div>
            <div class="quest-item">
                <div style="font-size:13px; color:#fff;">ساعة تركيز <br><small style="color:var(--neon-cyan)">+40 XP</small></div>
                <button id="q2" class="accept-btn" style="width:auto; margin:0;" onclick="addXP(40, 'q2')">إكمال</button>
            </div>
            <button class="accept-btn" onclick="goTo('win-status')">رجوع</button>
        </div>

        <div class="neon-bar"></div>
    </div>

    <script>
       const tg = window.Telegram.WebApp;
tg.ready(); // ضيف السطر ده هنا ضروري جداً
tg.expand();
let xp = 0;

        // وضع اسم المستخدم في كل الشاشات
        const user = tg.initDataUnsafe?.user;
        const name = user ? user.first_name : "أيها المستخدم";
        document.getElementById('p-name1').innerText = name;
        document.getElementById('p-name2').innerText = name;

        // وظيفة التنقل
       function goTo(id) {
    // 1. شغل الهزة الأول
    if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
    }
    
    // 2. استراحة قصيرة جداً للمتصفح قبل تغيير العناصر
    setTimeout(() => {
        document.querySelectorAll('.system-window').forEach(w => w.style.display = 'none');
        const targetWindow = document.getElementById(id);
        if (targetWindow) {
            targetWindow.style.display = 'block';
        }
    }, 50);
}

        // وظيفة إضافة الـ XP
        function addXP(amount, btnId) {
            xp += amount;
            if (xp > 100) xp = 100;
            document.getElementById('xp-text').innerText = xp + " / 100";
            document.getElementById('xp-bar').style.width = xp + "%";
            
            const btn = document.getElementById(btnId);
            btn.innerText = "تمت";
            btn.disabled = true;
            
            tg.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
