<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SYSTEM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --neon-cyan: #00f2ff;
            --bg-dark: rgba(2, 12, 18, 0.95);
        }

        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #001a24 0%, #000 100%);
        }

        .system-wrapper {
            position: relative;
            width: 85%; /* تقليل عرض الحاوية */
            max-width: 380px; /* تحديد حد أقصى أصغر للعرض */
            perspective: 1000px;
        }

        .neon-bar {
            height: 1.5px; /* تنحيف الخطوط */
            background: linear-gradient(90deg, transparent, var(--neon-cyan), #fff, var(--neon-cyan), transparent);
            box-shadow: 0 0 10px var(--neon-cyan);
            margin: 4px 0;
            animation: barPulse 2s infinite ease-in-out;
        }

        .system-window {
            background: var(--bg-dark);
            border: 1px solid rgba(0, 242, 255, 0.15);
            padding: 25px 20px; /* تقليل المسافات الداخلية */
            position: relative;
            backdrop-filter: blur(10px);
            clip-path: polygon(8% 0, 92% 0, 100% 12%, 100% 88%, 92% 100%, 8% 100%, 0 88%, 0 12%);
            animation: windowIn 0.6s ease-out;
        }

        .header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 242, 255, 0.1);
            padding-bottom: 10px;
        }

        .alert-icon {
            width: 25px; /* تصغير الأيقونة */
            height: 25px;
            border: 1.5px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-cyan);
            font-weight: 900;
            font-size: 14px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .system-title {
            color: #fff;
            font-size: 16px; /* تصغير الخط */
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .content {
            color: #d1f7ff;
            font-size: 15px; /* تصغير خط المحتوى */
            line-height: 1.6;
            text-align: center;
            margin-bottom: 25px;
        }

        .accept-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 30px;
            font-family: 'Cairo';
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: block;
            margin: 0 auto;
        }

        .accept-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .footer-note {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 15px;
            text-align: center;
        }

        @keyframes windowIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="system-wrapper">
        <div class="neon-bar"></div>
        <div class="system-window">
            <div class="header-box">
                <div class="alert-icon">!</div>
                <div class="system-title">تنبيه النظام</div>
            </div>
            <div class="content">
                مرحباً بك، <span id="player-name" style="color:#fff; font-weight:bold;">..</span>.<br>
                لقد استوفيت شروط الانضمام إلى <br>
                <span style="color:var(--neon-cyan); font-weight:bold;">"نظام الارتقاء الذاتي"</span>.
            </div>
            <button class="accept-btn" onclick="tg.close()">قـبـول</button>
            <div class="footer-note">تحذير: القرار نهائي وغير قابل للرجوع.</div>
        </div>
        <div class="neon-bar"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        document.getElementById('player-name').innerText = user ? user.first_name : "أيها المستخدم";

        // إضافة الصوت
        const systemSound = new Audio('system_up.mp3'); 
        function playSound() {
            systemSound.play().catch(() => {});
        }
        window.addEventListener('load', playSound);
        document.body.addEventListener('click', playSound, { once: true });
    </script>
</body>
</html>
